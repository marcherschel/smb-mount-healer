---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: smbquarantines.smbhealer.herschel.io
spec:
  group: smbhealer.herschel.io
  names:
    categories:
    - smbhealer
    kind: SmbQuarantine
    listKind: SmbQuarantineList
    plural: smbquarantines
    shortNames:
    - smbq
    singular: smbquarantine
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.nodeName
      name: Node
      type: string
    - jsonPath: .spec.pvName
      name: PV
      type: string
    - jsonPath: .status.files
      name: Files
      type: integer
    - description: Bytes
      jsonPath: .status.bytes
      name: Size
      type: integer
    - jsonPath: .spec.quarantinedTime
      name: Quarantined
      type: date
    - jsonPath: .status.lastScanTime
      name: Last Scan
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          SmbQuarantine shows that quarantined shadow data exists in one folder on a
          node. It reflects the disk: it disappears when the folder is gone or empty,
          and deleting it does not acknowledge anything (it is recreated while data remains).
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              SmbQuarantineSpec is immutable after creation. Every path in it is the
              healer's own (quarantine folder, source mount path), never user data.
            properties:
              nodeName:
                minLength: 1
                type: string
              path:
                description: Path is the absolute host path of the quarantine folder.
                pattern: ^/
                type: string
              pvName:
                minLength: 1
                type: string
              quarantinedTime:
                description: QuarantinedTime is when the folder was created (parsed
                  from its name for adopted folders).
                format: date-time
                type: string
              remediationRef:
                description: RemediationRef names the SmbMountRemediation that quarantined
                  the data; empty for adopted folders.
                type: string
              share:
                type: string
              sourcePath:
                description: |-
                  SourcePath is the globalmount or pod directory the data was moved out of
                  (empty for adopted folders).
                type: string
            required:
            - nodeName
            - path
            - pvName
            - quarantinedTime
            type: object
            x-kubernetes-validations:
            - message: spec is immutable
              rule: self == oldSelf
          status:
            description: |-
              SmbQuarantineStatus holds aggregates only. It deliberately has no field
              that could carry a file or directory name from the quarantined data
              (enforced by privacy_test.go). Condition messages must be fixed templates.
            properties:
              bytes:
                description: Bytes is the total size of regular files found by the
                  (bounded) walk.
                format: int64
                minimum: 0
                type: integer
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              entries:
                description: Entries is the number of top-level entries in the folder.
                format: int64
                minimum: 0
                type: integer
              files:
                description: Files is the number of regular files found by the (bounded)
                  walk.
                format: int64
                minimum: 0
                type: integer
              lastScanTime:
                format: date-time
                type: string
              newestModTime:
                format: date-time
                type: string
              oldestModTime:
                format: date-time
                type: string
              sizeTruncated:
                description: SizeTruncated is true when the walk budget (entries or
                  time) ran out.
                type: boolean
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
