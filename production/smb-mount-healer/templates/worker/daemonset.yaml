{{- $component := "worker" }}
{{- $ctx := dict "context" . "component" $component }}
{{- $p := .Values.worker.probing }}
{{- $q := .Values.worker.quarantineScan }}
{{- $root := .Values.kubeletRoot | trimSuffix "/" }}
{{- if and .Values.quarantineDir (not (hasPrefix (printf "%s/" $root) .Values.quarantineDir)) }}
{{- fail (printf "quarantineDir %q must be under kubeletRoot %q: the worker only mounts the kubelet root" .Values.quarantineDir $root) }}
{{- end }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "smb-mount-healer.componentName" $ctx }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "smb-mount-healer.componentLabels" $ctx | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "smb-mount-healer.selectorLabels" $ctx | nindent 6 }}
  {{- with .Values.worker.updateStrategy }}
  updateStrategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  template:
    metadata:
      labels:
        {{- include "smb-mount-healer.componentLabels" $ctx | nindent 8 }}
        {{- with .Values.worker.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.worker.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "smb-mount-healer.serviceAccountName" $ctx }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.worker.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- with .Values.worker.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.worker.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.worker.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # No hostPID/hostNetwork: mount visibility and umount both go through the
      # Bidirectional kubelet-dir mount below.
      terminationGracePeriodSeconds: 30
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: smb-mount-healer
          image: {{ include "smb-mount-healer.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --worker
            - --zap-log-level={{ .Values.logging.level }}
            - --zap-encoder={{ .Values.logging.encoder }}
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: CSI_DRIVER_NAME
              value: {{ .Values.csi.driverName | quote }}
            - name: KUBELET_ROOT
              value: {{ .Values.kubeletRoot | trimSuffix "/" | quote }}
            {{- with .Values.quarantineDir }}
            - name: QUARANTINE_DIR
              value: {{ . | quote }}
            {{- end }}
            - name: CHECK_INTERVAL
              value: {{ $p.checkInterval | quote }}
            - name: RECHECK_ATTEMPTS
              value: {{ $p.recheckAttempts | int64 | toString | quote }}
            - name: RECHECK_DELAY
              value: {{ $p.recheckDelay | quote }}
            - name: STAT_TIMEOUT
              value: {{ $p.statTimeout | quote }}
            - name: SLOW_CONFIRM_WINDOW
              value: {{ $p.slowConfirmWindow | quote }}
            - name: SLOW_RECOVERY_WINDOW
              value: {{ $p.slowRecoveryWindow | quote }}
            - name: POD_STARTUP_GRACE
              value: {{ $p.podStartupGrace | quote }}
            - name: STARTUP_GRACE
              value: {{ $p.startupGrace | quote }}
            - name: PROBE_CONCURRENCY
              value: {{ $p.probeConcurrency | int64 | toString | quote }}
            - name: EXPECTED_FSTYPES
              value: {{ $p.expectedFsTypes | quote }}
            - name: STATUS_HEARTBEAT
              value: {{ $p.statusHeartbeat | quote }}
            - name: QUARANTINE_SCAN_INTERVAL
              value: {{ $q.interval | quote }}
            - name: QUARANTINE_SCAN_MAX_ENTRIES
              value: {{ $q.maxEntries | int64 | toString | quote }}
            - name: QUARANTINE_SCAN_TIME_BUDGET
              value: {{ $q.timeBudget | quote }}
            {{- with .Values.worker.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: http-metrics
              containerPort: 8080
              protocol: TCP
            - name: health
              containerPort: 8081
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          {{- with .Values.worker.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            # Not configurable: umount(2) needs CAP_SYS_ADMIN in the host mount
            # namespace, and Bidirectional propagation requires a privileged
            # container.
            privileged: true
            runAsUser: 0
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: kubelet-dir
              mountPath: {{ $root }}
              # Load-bearing: makes host mounts under this path visible in the
              # container's /proc/self/mountinfo and carries umounts and
              # quarantine moves back to the host.
              mountPropagation: Bidirectional
      volumes:
        - name: kubelet-dir
          hostPath:
            path: {{ $root }}
            type: Directory
