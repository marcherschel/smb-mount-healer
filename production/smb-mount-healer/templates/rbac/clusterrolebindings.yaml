{{- range $component := list "controlplane" "worker" }}
{{- $ctx := dict "context" $ "component" $component }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "smb-mount-healer.componentName" $ctx }}
  labels:
    {{- include "smb-mount-healer.componentLabels" $ctx | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "smb-mount-healer.componentName" $ctx }}
subjects:
  - kind: ServiceAccount
    name: {{ include "smb-mount-healer.serviceAccountName" $ctx }}
    namespace: {{ $.Release.Namespace }}
{{- end }}
