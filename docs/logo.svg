<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-labelledby="title">
  <title id="title">smb-mount-healer</title>
  <!-- background -->
  <rect x="4" y="4" width="120" height="120" rx="26" fill="#1e3a8a"/>
  <!-- network share: drive body with two status lights -->
  <rect x="22" y="40" width="70" height="40" rx="8" fill="#e0e7ff"/>
  <rect x="22" y="62" width="70" height="2.5" fill="#1e3a8a" opacity="0.25"/>
  <circle cx="36" cy="72" r="3.5" fill="#1e3a8a"/>
  <circle cx="48" cy="72" r="3.5" fill="#1e3a8a"/>
  <!-- network link below the drive -->
  <rect x="55" y="80" width="4" height="14" fill="#e0e7ff"/>
  <rect x="34" y="94" width="46" height="4" rx="2" fill="#e0e7ff"/>
  <!-- healing badge -->
  <circle cx="92" cy="40" r="22" fill="#22c55e" stroke="#1e3a8a" stroke-width="5"/>
  <rect x="88" y="27" width="8" height="26" rx="2" fill="#ffffff"/>
  <rect x="79" y="36" width="26" height="8" rx="2" fill="#ffffff"/>
</svg>
