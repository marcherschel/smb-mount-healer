            claimName: storagebox-e2e-config-b-claim
---
apiVersion: v1
kind: Service
metadata:
  name: sts-single
  namespace: smbmh-fixtures
  labels:
    app.kubernetes.io/name: sts-single
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: sts-single
