      containers:
        - name: heartbeat
          image: busybox:1.37.0@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e
          command: ["/bin/sh", "-c"]
          args:
            - |
              while true; do
                for d in $HB_DIRS; do
                  date +%s > "$d/hb-$POD_NAME" || echo "heartbeat write to $d failed"
                done
                sleep 2
              done
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: HB_DIRS
              value: "/data"
          resources:
            requests:
              cpu: 1m
