# Node-stage credentials of the SMB account
# (storagebox-<account>-credentials in kube-system). Test-only values; must
# match manifests/samba/secret.yaml.
apiVersion: v1
kind: Secret
metadata:
  name: storagebox-e2e-credentials
  namespace: kube-system
type: Opaque
stringData:
  username: e2esmbuser
  password: smbmh-e2e-not-a-secret
