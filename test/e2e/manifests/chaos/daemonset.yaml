apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: chaos
  labels:
    app.kubernetes.io/name: chaos
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: chaos
  template:
    metadata:
      labels:
        app.kubernetes.io/name: chaos
    spec:
      tolerations:
        - operator: Exists
      # Host network like csi-smb-node, so a cifs mount made here (S8) uses the
      # node's network namespace; cluster DNS still resolves samba-landmine.
      hostNetwork: true
      # Host PID namespace (of the k3d node container) so tests can freeze and
      # thaw healer/driver processes with SIGSTOP/SIGCONT (S12, S12a).
      hostPID: true
      dnsPolicy: ClusterFirstWithHostNet
      terminationGracePeriodSeconds: 1
      containers:
        - name: chaos
          # Plain alpine; mount.cifs (cifs-utils), umount -l / findmnt
          # (util-linux) and tc (iproute2, S3 netem) are installed at start. Needs egress to the alpine
          # mirrors; the pod is Ready only once the tools are present.
          image: alpine:3.24.2@sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              apk add --no-cache cifs-utils util-linux coreutils findutils iproute2 procps >/dev/null
              command -v mount.cifs findmnt tc pgrep
              touch /tmp/ready
              exec sleep infinity
          readinessProbe:
            exec:
              command: ["test", "-f", "/tmp/ready"]
            periodSeconds: 2
          resources:
            requests:
              cpu: 1m
              memory: 8Mi
            limits:
              memory: 128Mi
          securityContext:
            privileged: true
          volumeMounts:
            - name: kubelet-dir
              mountPath: /var/lib/kubelet
              mountPropagation: Bidirectional
      volumes:
        - name: kubelet-dir
          hostPath:
            path: /var/lib/kubelet
            type: Directory
