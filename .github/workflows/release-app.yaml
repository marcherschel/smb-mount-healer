name: release-app

# App release, started by hand (Actions -> release-app -> Run workflow on main)
# with the kind of release; the version is never typed by hand:
#   bump: patch|minor|major  next stable version after the latest stable
#                            v* tag (prerelease: its next -rc.N instead)
#         rc                 next candidate of the open release candidate line
# (hack/next-version.sh). The CI suite runs on the main commit; only when it
# passes is the tag vX.Y.Z created on that commit. Pushing a tag vX.Y.Z (or
# vX.Y.Z-rc.N) yourself still works. Either way it publishes, with version X.Y.Z:
#   ghcr.io/<owner>/smb-mount-healer:X.Y.Z   image (linux/amd64 + linux/arm64,
#                                            SBOM, provenance attestation)
#   GitHub release vX.Y.Z with dist/app (make dist-app): static binaries
#   smb-mount-healer-linux-{amd64,arm64} (with provenance and SBOM
#   attestations), their SBOMs (.spdx.json, .cdx.json), the image SBOMs
#   (smb-mount-healer-image-linux-{amd64,arm64}.spdx.json), the CRDs of this
#   API version, SHA256SUMS; plus SHA256SUMS.sigstore.json (cosign bundle) and
#   the binaries' provenance bundle smb-mount-healer.intoto.jsonl.
# How to verify all of it: SECURITY.md#verifying-a-release.
# The chart is released separately (tags chart-v*, release-chart.yaml); every
# chart release pins the latest stable app release as its appVersion.
# The full CI suite (lint, unit, envtest, e2e) gates every publish step,
# unless the tests are skipped on purpose:
#   - an annotated tag whose message contains "[skip tests]"
#     (git tag -a v0.1.0 -m "smb-mount-healer v0.1.0 [skip tests]"), or
#   - a manual run (workflow_dispatch) with skip_tests.
# A manual run with input `tag` re-releases an existing tag whose run failed
# (`bump` is ignored then).

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+", "v[0-9]+.[0-9]+.[0-9]+-*"]
  workflow_dispatch:
    inputs:
      bump:
        description: "Release kind: patch|minor|major (from the latest stable app release) or rc (next candidate of the open release candidate)"
        type: choice
        options: [patch, minor, major, rc]
        default: patch
      prerelease:
        description: "With patch|minor|major: release the next release candidate (-rc.N) of that version instead"
        type: boolean
        default: false
      tag:
        description: "Optional: release this existing app tag again (vX.Y.Z[-rc.N]) instead of a new version"
        type: string
        default: ""
      skip_tests:
        description: "Publish without running the CI suite first"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-app-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: safe.directory
  GIT_CONFIG_VALUE_0: "*"

defaults:
  run:
    shell: bash

jobs:
  # Which tag, which version, which commit, whether the tag must still be
  # created, and whether the CI suite runs first.
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      version: ${{ steps.plan.outputs.version }}
      ref: ${{ steps.plan.outputs.ref }}
      create_tag: ${{ steps.plan.outputs.create_tag }}
      skip_tests: ${{ steps.plan.outputs.skip_tests }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # tags and their annotations
          ref: ${{ github.sha }}

      - name: Plan
        id: plan
        env:
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_SKIP: ${{ inputs.skip_tests }}
          BUMP: ${{ inputs.bump }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ -z "$INPUT_TAG" ]; then
            # New release: next version from the tags, on the main commit.
            if [ "$GITHUB_REF" != refs/heads/main ]; then
              echo "::error::new app releases are cut from main (run the workflow on main, not ${GITHUB_REF})"
              exit 1
            fi
            version=$(hack/next-version.sh app "$BUMP" "$PRERELEASE")
            tag="v${version}"
            if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
              echo "::error::tag ${tag} already exists"
              exit 1
            fi
            ref=$GITHUB_SHA
            create_tag=true
          else
            tag=${INPUT_TAG:-$GITHUB_REF_NAME}
            version=${tag#v}
            if [[ "$tag" != v* || ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::tag ${tag} is not vX.Y.Z[-pre]"
              exit 1
            fi
            git rev-parse -q --verify "refs/tags/${tag}" >/dev/null || { echo "::error::tag ${tag} does not exist"; exit 1; }
            # The cosign signature names the ref the workflow ran on; SECURITY.md
            # documents main or a v* tag.
            if [ "$GITHUB_REF" != refs/heads/main ] && [[ "$GITHUB_REF" != refs/tags/v* ]]; then
              echo "::error::release ${tag} again from main or a v* tag, not ${GITHUB_REF}"
              exit 1
            fi
            ref="refs/tags/${tag}"
            create_tag=false
          fi
          skip=false
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            [ "$INPUT_SKIP" = true ] && skip=true
          elif git tag -l --format='%(contents)' "$tag" | grep -qiF '[skip tests]'; then
            skip=true
          fi
          if [ "$skip" = true ]; then
            echo "::warning::publishing ${tag} WITHOUT running the CI suite"
          fi
          {
            echo "tag=${tag}"
            echo "version=${version}"
            echo "ref=${ref}"
            echo "create_tag=${create_tag}"
            echo "skip_tests=${skip}"
          } >> "$GITHUB_OUTPUT"
          echo "release ${tag} (version ${version}) from ${ref}, create tag: ${create_tag}, skip tests: ${skip}"

  ci:
    needs: plan
    if: needs.plan.outputs.skip_tests != 'true'
    uses: ./.github/workflows/ci.yaml
    with:
      ref: ${{ needs.plan.outputs.ref }}
    permissions:
      contents: read
      packages: read # pull the CI image from GHCR

  # A new release's tag exists only once the suite passed on its commit (or the
  # tests were skipped on purpose), so a failed run leaves no tag behind and
  # the next run computes the same version again. Created with the
  # GITHUB_TOKEN, so it does not trigger this workflow a second time.
  tag:
    name: Create tag
    needs: [plan, ci]
    if: >-
      ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.create_tag == 'true' &&
        (needs.ci.result == 'success' || (needs.ci.result == 'skipped' && needs.plan.outputs.skip_tests == 'true')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create ${{ needs.plan.outputs.tag }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.plan.outputs.tag }}
          SHA: ${{ needs.plan.outputs.ref }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/git/refs" -f ref="refs/tags/${TAG}" -f sha="$SHA" >/dev/null
          echo "created ${TAG} -> ${SHA}"

  publish:
    name: Image + binaries
    needs: [plan, ci, tag]
    # Runs after a green CI suite, or when the tests were skipped on purpose,
    # once the tag exists.
    if: >-
      ${{ !cancelled() && needs.plan.result == 'success' &&
        (needs.ci.result == 'success' || (needs.ci.result == 'skipped' && needs.plan.outputs.skip_tests == 'true')) &&
        (needs.tag.result == 'success' || (needs.tag.result == 'skipped' && needs.plan.outputs.create_tag != 'true')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # attestations
      attestations: write
    container:
      image: ghcr.io/marcherschel/smb-mount-healer-ci:f240ac92682eea72cf37e1996724dd559d02797b@sha256:586218b4b8b19f8c211f1154e9753d149c6238d9c656d096e903255a19e1bdcc
      volumes:
        - /var/run/docker.sock:/var/run/docker.sock
    env:
      IMAGE_REPO: ghcr.io/${{ github.repository_owner }}/smb-mount-healer
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.plan.outputs.tag }}

      # The final apt layer of the image runs under the target platform.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push linux/amd64 + linux/arm64
        id: push
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          metadata="${RUNNER_TEMP}/image-metadata.json"
          make image \
            VERSION="$VERSION" \
            IMG="${IMAGE_REPO}:${VERSION}" \
            PLATFORMS=linux/amd64,linux/arm64 \
            IMAGE_OUTPUT="--push --sbom=true --provenance=mode=max" \
            IMAGE_METADATA_FILE="$metadata"
          digest=$(yq -p json -o yaml '."containerimage.digest"' "$metadata")
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::no image digest in buildx metadata"
            cat "$metadata"
            exit 1
          fi
          echo "pushed ${IMAGE_REPO}:${VERSION}@${digest}"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_REPO }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      # Binaries, their SBOMs (syft) and the image SBOMs BuildKit attached
      # to the image just pushed.
      - name: Build release binaries and SBOMs (make dist-app)
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          SBOM_IMAGE: ${{ env.IMAGE_REPO }}@${{ steps.push.outputs.digest }}
        run: make dist-app VERSION="$VERSION" SBOM_IMAGE="$SBOM_IMAGE"

      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        id: provenance
        with:
          subject-path: |
            dist/app/smb-mount-healer-linux-amd64
            dist/app/smb-mount-healer-linux-arm64

      # One SBOM attestation per binary (its own SPDX SBOM):
      # gh attestation verify <binary> --repo <owner>/smb-mount-healer --predicate-type https://spdx.dev/Document/v2.3
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/app/smb-mount-healer-linux-amd64
          sbom-path: dist/app/smb-mount-healer-linux-amd64.spdx.json

      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/app/smb-mount-healer-linux-arm64
          sbom-path: dist/app/smb-mount-healer-linux-arm64.spdx.json

      # The binaries' provenance bundle as a release asset too (OpenSSF
      # Scorecard Signed-Releases looks for *.intoto.jsonl); not listed in
      # SHA256SUMS.
      - name: Provenance bundle as release asset
        env:
          BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: cp "$BUNDLE" dist/app/smb-mount-healer.intoto.jsonl

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-app
          path: dist/app/
          if-no-files-found: error

  # cosign-installer needs envsubst, which the CI image lacks: sign on the
  # plain runner. Keyless signatures (GitHub OIDC -> Sigstore): one attached to
  # the image in GHCR, one Sigstore bundle of SHA256SUMS for the GitHub
  # release. Both are verified with the identity SECURITY.md documents.
  sign:
    name: Sign image
    needs: publish
    # An explicit condition: without it the job inherits the skip of `ci`
    # (tests skipped on purpose) through `publish` and never runs.
    if: ${{ !cancelled() && needs.publish.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # keyless cosign signature
    env:
      # Keep in sync with SECURITY.md#verifying-a-release.
      IDENTITY_REGEXP: ^https://github\.com/${{ github.repository }}/\.github/workflows/release-app\.yaml@refs/(heads/main|tags/v)
      OIDC_ISSUER: https://token.actions.githubusercontent.com
    steps:
      - uses: sigstore/cosign-installer@881c63bd87e38389154debd8331404ce7ca8a3ab # v4.1.4

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-app
          path: dist/app

      - name: Sign the image (cosign, keyless)
        env:
          REF: ghcr.io/${{ github.repository_owner }}/smb-mount-healer@${{ needs.publish.outputs.digest }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | cosign login ghcr.io -u "${{ github.actor }}" --password-stdin
          cosign sign --yes "$REF"
          cosign verify "$REF" --certificate-identity-regexp "$IDENTITY_REGEXP" --certificate-oidc-issuer "$OIDC_ISSUER" >/dev/null
          echo "verified ${REF}"

      # OpenSSF Scorecard Signed-Releases looks for *.sigstore.json assets.
      - name: Sign SHA256SUMS (cosign, keyless)
        run: |
          mkdir -p "${RUNNER_TEMP}/sigs"
          bundle="${RUNNER_TEMP}/sigs/SHA256SUMS.sigstore.json"
          cosign sign-blob --yes --bundle "$bundle" dist/app/SHA256SUMS
          cosign verify-blob --bundle "$bundle" --certificate-identity-regexp "$IDENTITY_REGEXP" \
            --certificate-oidc-issuer "$OIDC_ISSUER" dist/app/SHA256SUMS

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-app-sigs
          path: ${{ runner.temp }}/sigs/
          if-no-files-found: error

  github-release:
    name: GitHub release
    needs: [plan, publish, sign]
    if: ${{ !cancelled() && needs.publish.result == 'success' && needs.sign.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.plan.outputs.tag }}
          fetch-depth: 0 # previous app tag for the release notes

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-app
          path: dist/app

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-app-sigs
          path: dist/app

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.plan.outputs.version }}
          TAG: ${{ needs.plan.outputs.tag }}
          SKIPPED: ${{ needs.plan.outputs.skip_tests }}
        run: |
          flags=(--generate-notes --verify-tag)
          if [ "$SKIPPED" = true ]; then
            notes="${RUNNER_TEMP}/notes.md"
            echo "> Published without running the CI suite (tests skipped on purpose)." >"$notes"
            flags+=(--notes-file "$notes")
          fi
          # Notes since the previous app release, never since a chart-v* tag.
          previous=$(git -c versionsort.suffix=- tag -l 'v[0-9]*' --sort=-v:refname | grep -vx "$TAG" | head -1 || true)
          if [ -n "$previous" ]; then
            flags+=(--notes-start-tag "$previous")
          fi
          # Only -rc/-beta/... tags are prereleases. App releases are the
          # repository's "Latest" release (binaries, CRDs); chart releases never are.
          if [[ "$VERSION" == *-* ]]; then
            flags+=(--prerelease --latest=false)
          else
            flags+=(--latest)
          fi
          gh release create "$TAG" dist/app/* --repo "$GITHUB_REPOSITORY" \
            --title "smb-mount-healer $TAG" "${flags[@]}"
