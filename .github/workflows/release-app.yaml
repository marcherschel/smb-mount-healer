name: release-app

# App release: pushing a tag vX.Y.Z (or vX.Y.Z-rc.N) publishes, with version X.Y.Z:
#   ghcr.io/<owner>/smb-mount-healer:X.Y.Z   image (linux/amd64 + linux/arm64,
#                                            SBOM, provenance attestation)
#   GitHub release vX.Y.Z with dist/app (make dist-app): static binaries
#   smb-mount-healer-linux-{amd64,arm64} (with provenance attestation), the
#   CRDs of this API version, SHA256SUMS.
# The chart is released separately (tags chart-v*, release-chart.yaml); after
# this release Renovate opens the PR that moves the chart's appVersion here.
# The full CI suite (lint, unit, envtest, e2e) gates every publish step,
# unless the tests are skipped on purpose:
#   - an annotated tag whose message contains "[skip tests]"
#     (git tag -a v0.1.0 -m "smb-mount-healer v0.1.0 [skip tests]"), or
#   - a manual run (workflow_dispatch) for an existing tag with skip_tests.
# A manual run also re-releases a tag whose tag-triggered run failed.

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+", "v[0-9]+.[0-9]+.[0-9]+-*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing app tag to release (vX.Y.Z or vX.Y.Z-rc.N)"
        type: string
        required: true
      skip_tests:
        description: "Publish without running the CI suite first"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-app-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: safe.directory
  GIT_CONFIG_VALUE_0: "*"

defaults:
  run:
    shell: bash

jobs:
  # Which tag, which version, and whether the CI suite runs first.
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      version: ${{ steps.plan.outputs.version }}
      skip_tests: ${{ steps.plan.outputs.skip_tests }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # tags and their annotations

      - name: Plan
        id: plan
        env:
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_SKIP: ${{ inputs.skip_tests }}
        run: |
          tag=${INPUT_TAG:-$GITHUB_REF_NAME}
          version=${tag#v}
          if [[ "$tag" != v* || ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::tag ${tag} is not vX.Y.Z[-pre]"
            exit 1
          fi
          git rev-parse -q --verify "refs/tags/${tag}" >/dev/null || { echo "::error::tag ${tag} does not exist"; exit 1; }
          skip=false
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            [ "$INPUT_SKIP" = true ] && skip=true
          elif git tag -l --format='%(contents)' "$tag" | grep -qiF '[skip tests]'; then
            skip=true
          fi
          if [ "$skip" = true ]; then
            echo "::warning::publishing ${tag} WITHOUT running the CI suite"
          fi
          {
            echo "tag=${tag}"
            echo "version=${version}"
            echo "skip_tests=${skip}"
          } >> "$GITHUB_OUTPUT"
          echo "release ${tag} (version ${version}), skip tests: ${skip}"

  ci:
    needs: plan
    if: needs.plan.outputs.skip_tests != 'true'
    uses: ./.github/workflows/ci.yaml
    with:
      ref: refs/tags/${{ needs.plan.outputs.tag }}
    permissions:
      contents: read
      packages: read # pull the CI image from GHCR

  publish:
    name: Image + binaries
    needs: [plan, ci]
    # Runs after a green CI suite, or when the tests were skipped on purpose.
    if: >-
      ${{ !cancelled() && needs.plan.result == 'success' &&
        (needs.ci.result == 'success' || (needs.ci.result == 'skipped' && needs.plan.outputs.skip_tests == 'true')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # attestations
      attestations: write
    container:
      image: ghcr.io/marcherschel/smb-mount-healer-ci:f1efcd46699ef82731693ce4300bc2953eaadfd5@sha256:55dd187dd2852259466ccf44a85c585636ee5455de50a0cb3d886caba0caf4d7
      volumes:
        - /var/run/docker.sock:/var/run/docker.sock
    env:
      IMAGE_REPO: ghcr.io/${{ github.repository_owner }}/smb-mount-healer
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.plan.outputs.tag }}

      # The final apt layer of the image runs under the target platform.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push linux/amd64 + linux/arm64
        id: push
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          metadata="${RUNNER_TEMP}/image-metadata.json"
          make image \
            VERSION="$VERSION" \
            IMG="${IMAGE_REPO}:${VERSION}" \
            PLATFORMS=linux/amd64,linux/arm64 \
            IMAGE_OUTPUT="--push --sbom=true --provenance=mode=max" \
            IMAGE_METADATA_FILE="$metadata"
          digest=$(yq -p json -o yaml '."containerimage.digest"' "$metadata")
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::no image digest in buildx metadata"
            cat "$metadata"
            exit 1
          fi
          echo "pushed ${IMAGE_REPO}:${VERSION}@${digest}"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_REPO }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Build release binaries (make dist-app)
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: make dist-app VERSION="$VERSION"

      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/app/smb-mount-healer-linux-*

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-app
          path: dist/app/
          if-no-files-found: error

  # cosign-installer needs envsubst, which the CI image lacks: sign on the
  # plain runner. Keyless signature (GitHub OIDC -> Sigstore) attached to the
  # image in GHCR.
  sign:
    name: Sign image
    needs: publish
    # An explicit condition: without it the job inherits the skip of `ci`
    # (tests skipped on purpose) through `publish` and never runs.
    if: ${{ !cancelled() && needs.publish.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # keyless cosign signature
    steps:
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the image (cosign, keyless)
        env:
          REF: ghcr.io/${{ github.repository_owner }}/smb-mount-healer@${{ needs.publish.outputs.digest }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | cosign login ghcr.io -u "${{ github.actor }}" --password-stdin
          cosign sign --yes "$REF"

  github-release:
    name: GitHub release
    needs: [plan, publish, sign]
    if: ${{ !cancelled() && needs.publish.result == 'success' && needs.sign.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.plan.outputs.tag }}
          fetch-depth: 0 # previous app tag for the release notes

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-app
          path: dist/app

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.plan.outputs.version }}
          TAG: ${{ needs.plan.outputs.tag }}
          SKIPPED: ${{ needs.plan.outputs.skip_tests }}
        run: |
          flags=(--generate-notes --verify-tag)
          if [ "$SKIPPED" = true ]; then
            notes="${RUNNER_TEMP}/notes.md"
            echo "> Published without running the CI suite (tests skipped on purpose)." >"$notes"
            flags+=(--notes-file "$notes")
          fi
          # Notes since the previous app release, never since a chart-v* tag.
          previous=$(git -c versionsort.suffix=- tag -l 'v[0-9]*' --sort=-v:refname | grep -vx "$TAG" | head -1 || true)
          if [ -n "$previous" ]; then
            flags+=(--notes-start-tag "$previous")
          fi
          # Only -rc/-beta/... tags are prereleases. App releases are the
          # repository's "Latest" release (binaries, CRDs); chart releases never are.
          if [[ "$VERSION" == *-* ]]; then
            flags+=(--prerelease --latest=false)
          else
            flags+=(--latest)
          fi
          gh release create "$TAG" dist/app/* --repo "$GITHUB_REPOSITORY" \
            --title "smb-mount-healer $TAG" "${flags[@]}"
