name: release-app

# App release: pushing a tag vX.Y.Z (or vX.Y.Z-rc.N) publishes, with version X.Y.Z:
#   ghcr.io/<owner>/smb-mount-healer:X.Y.Z   image (linux/amd64 + linux/arm64,
#                                            SBOM, provenance attestation)
#   GitHub release vX.Y.Z with dist/app (make dist-app): static binaries
#   smb-mount-healer-linux-{amd64,arm64} (with provenance attestation), the
#   CRDs of this API version, SHA256SUMS.
# The chart is released separately (tags chart-v*, release-chart.yaml); after
# this release Renovate opens the PR that moves the chart's appVersion here.
# The full CI suite (lint, unit, envtest, e2e) gates every publish step.

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+", "v[0-9]+.[0-9]+.[0-9]+-*"]

permissions:
  contents: read

concurrency:
  group: release-app-${{ github.ref }}
  cancel-in-progress: false

env:
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: safe.directory
  GIT_CONFIG_VALUE_0: "*"

defaults:
  run:
    shell: bash

jobs:
  ci:
    uses: ./.github/workflows/ci.yaml
    permissions:
      contents: read
      packages: read # pull the CI image from GHCR

  publish:
    name: Image + binaries
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # attestations
      attestations: write
    container:
      image: ghcr.io/marcherschel/smb-mount-healer-ci:f1efcd46699ef82731693ce4300bc2953eaadfd5@sha256:55dd187dd2852259466ccf44a85c585636ee5455de50a0cb3d886caba0caf4d7
      # Pulling the CI image needs credentials while its GHCR package is private.
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      volumes:
        - /var/run/docker.sock:/var/run/docker.sock
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      IMAGE_REPO: ghcr.io/${{ github.repository_owner }}/smb-mount-healer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Version from tag
        id: version
        run: |
          version=${GITHUB_REF_NAME#v}
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::tag ${GITHUB_REF_NAME} is not vX.Y.Z[-pre]"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      # The final apt layer of the image runs under the target platform.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push linux/amd64 + linux/arm64
        id: push
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          metadata="${RUNNER_TEMP}/image-metadata.json"
          make image \
            VERSION="$VERSION" \
            IMG="${IMAGE_REPO}:${VERSION}" \
            PLATFORMS=linux/amd64,linux/arm64 \
            IMAGE_OUTPUT="--push --sbom=true --provenance=mode=max" \
            IMAGE_METADATA_FILE="$metadata"
          digest=$(yq -p json -o yaml '."containerimage.digest"' "$metadata")
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::no image digest in buildx metadata"
            cat "$metadata"
            exit 1
          fi
          echo "pushed ${IMAGE_REPO}:${VERSION}@${digest}"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_REPO }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Build release binaries (make dist-app)
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: make dist-app VERSION="$VERSION"

      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/app/smb-mount-healer-linux-*

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-app
          path: dist/app/
          if-no-files-found: error

  github-release:
    name: GitHub release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # previous app tag for the release notes

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-app
          path: dist/app

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.publish.outputs.version }}
        run: |
          flags=(--generate-notes --verify-tag)
          # Notes since the previous app release, never since a chart-v* tag.
          previous=$(git -c versionsort.suffix=- tag -l 'v[0-9]*' --sort=-v:refname | grep -vx "$GITHUB_REF_NAME" | head -1 || true)
          if [ -n "$previous" ]; then
            flags+=(--notes-start-tag "$previous")
          fi
          # 0.x and -rc/-beta tags are prereleases (API v1alpha1).
          if [[ "$VERSION" == 0.* || "$VERSION" == *-* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" dist/app/* --repo "$GITHUB_REPOSITORY" \
            --title "smb-mount-healer $GITHUB_REF_NAME" "${flags[@]}"
