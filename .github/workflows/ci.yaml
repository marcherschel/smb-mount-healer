name: ci

# No run on pushes to main: changes only reach main through PRs (main
# ruleset), and the PR run is the trust boundary; validating the merge again
# would only repeat it.
on:
  pull_request:
  workflow_dispatch:
    inputs:
      cifs_diagnostic:
        description: "Run test/e2e/hack/cifs-dead-server.sh after the e2e suite"
        type: boolean
        default: false
      e2e_node_cpuset:
        description: "Pin the k3d node containers to these CPUs (docker --cpuset-cpus, e.g. 0,1); empty = no pinning"
        type: string
        default: ""
      e2e_run:
        description: "go test -run regex for the e2e suite (empty = the diagnosis subset set in the e2e job; . = all)"
        type: string
        default: ""
  # The release workflow runs the full suite before it publishes anything.
  workflow_call:
    inputs:
      ref:
        description: "Git ref to test (default: the commit that triggered the caller, e.g. the pushed tag)"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  # workflow_call runs share the caller's run; keep them out of the PR group.
  group: ci-${{ github.workflow_ref }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Job containers run with HOME=/github/home; keep Go caches there (outside the
# checkout, so they never show up in the generated-files diff check).
env:
  GOCACHE: /github/home/.cache/go-build
  GOMODCACHE: /github/home/go/pkg/mod
  GOLANGCI_LINT_CACHE: /github/home/.cache/golangci-lint
  # The job container runs as root while the workspace directory may be owned
  # by the runner user; avoid git's "dubious ownership" refusal.
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: safe.directory
  GIT_CONFIG_VALUE_0: "*"

defaults:
  run:
    shell: bash

jobs:
  # Decides how much of the suite a change needs (hack/ci-needs-run.sh):
  #   full  lint, unit/envtest, e2e
  #   chart lint only (the change is limited to the chart and monitoring/)
  #   none  nothing (Markdown, workflows other than this one, octo-sts policies)
  # Skipped jobs satisfy the required checks of the main ruleset;
  # paths-ignore on the trigger would leave them pending forever instead.
  changes:
    name: Detect relevant changes
    runs-on: ubuntu-latest
    outputs:
      suite: ${{ steps.decide.outputs.suite }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Decide
        id: decide
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            # The PR checkout is the merge commit; its first parent is the base.
            suite=$(git diff --name-only HEAD^1 HEAD | hack/ci-needs-run.sh)
          else
            # Releases (workflow_call from the tag-triggered release
            # workflows) and manual runs always get the full suite.
            suite=full
          fi
          echo "suite=${suite}" >> "$GITHUB_OUTPUT"
          echo "CI suite: ${suite}"

  lint:
    name: Lint + generated files
    needs: changes
    if: needs.changes.outputs.suite != 'none'
    runs-on: ubuntu-latest
    container:
      # CI toolbox built from .github/ci-image (workflow ci-image.yaml).
      image: ghcr.io/marcherschel/smb-mount-healer-ci:f1efcd46699ef82731693ce4300bc2953eaadfd5@sha256:55dd187dd2852259466ccf44a85c585636ee5455de50a0cb3d886caba0caf4d7
      # make chart-test runs the pinned kubeconform and promtool images.
      volumes:
        - /var/run/docker.sock:/var/run/docker.sock
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0 # tags for hack/check-chart-version.sh

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            /github/home/.cache/go-build
            /github/home/go/pkg/mod
            /github/home/.cache/golangci-lint
          key: lint-${{ hashFiles('go.sum') }}
          restore-keys: lint-

      - name: go mod tidy check
        run: make tidy-check

      - name: golangci-lint
        run: make lint

      - name: Dashboard and alerts use existing metric names
        run: hack/check-dashboard-metrics.sh

      # Chart changes since the last chart-v* release need a higher
      # Chart.yaml version (the chart is released on its own tags).
      - name: Chart version bumped when the chart changed
        run: hack/check-chart-version.sh

      # manifests also regenerates the chart's CRD/ClusterRole templates and
      # copies monitoring/ into the chart (hack/sync-chart.sh); chart-docs
      # its README (helm-docs).
      - name: Generated files are up to date
        run: |
          make generate manifests chart-docs
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::'make generate manifests chart-docs' changed files; run it locally and commit the result."
            git status --porcelain
            git diff
            exit 1
          fi

      # helm lint --strict + helm template/kubeconform/promtool/yq assertions
      # for every production/smb-mount-healer/ci/*-values.yaml (hack/chart-test.sh).
      - name: Helm chart lint + test
        run: make chart-lint chart-test

      # values.yaml defaults == the binary's defaults (internal/config). Also
      # part of the unit tests, repeated here because chart-only changes skip
      # the unit job.
      - name: Chart defaults match the binary
        run: go test ./production/...

  # Downloads the Go modules and compiles every test variant once, under the
  # one shared key that unit, envtest, sim and e2e restore (restore only).
  # Without it, a go.sum change (e.g. Renovate) made all of them miss their
  # own keys and download/compile the same things in parallel.
  deps:
    name: Go module + build cache
    needs: changes
    if: needs.changes.outputs.suite == 'full'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/marcherschel/smb-mount-healer-ci:f1efcd46699ef82731693ce4300bc2953eaadfd5@sha256:55dd187dd2852259466ccf44a85c585636ee5455de50a0cb3d886caba0caf4d7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache
        with:
          path: |
            /github/home/.cache/go-build
            /github/home/go/pkg/mod
          key: go-${{ hashFiles('go.sum') }}
          restore-keys: go-

      # Exact hit: a previous run already saved this key, and the save step
      # would skip anyway. -exec true compiles the test binaries without
      # running them (the envtest TestMains would start kube-apiserver even
      # with -run '^$'). -race and the build tags each produce separate
      # cache entries, so warm every variant the later jobs build.
      - name: Download modules + warm build cache
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          go mod download
          go test -race -exec true ./...                   # make test
          go test -race -tags envtest -exec true ./...     # make test-envtest
          go test -exec true ./internal/sim/...            # make sim-update
          go test -tags e2e -exec true ./test/e2e/...      # e2e suite

  # Unit tests, envtest and the simulator golden traces run as three parallel
  # jobs; e2e starts once all of them (and lint) succeeded.
  unit:
    name: Unit tests
    needs: [changes, deps]
    if: needs.changes.outputs.suite == 'full'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/marcherschel/smb-mount-healer-ci:f1efcd46699ef82731693ce4300bc2953eaadfd5@sha256:55dd187dd2852259466ccf44a85c585636ee5455de50a0cb3d886caba0caf4d7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      # Restore only: deps saved this key; the parallel jobs never race to save it.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            /github/home/.cache/go-build
            /github/home/go/pkg/mod
          key: go-${{ hashFiles('go.sum') }}
          restore-keys: go-

      - name: Unit tests
        run: make test

  envtest:
    name: envtest
    needs: [changes, deps]
    if: needs.changes.outputs.suite == 'full'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/marcherschel/smb-mount-healer-ci:f1efcd46699ef82731693ce4300bc2953eaadfd5@sha256:55dd187dd2852259466ccf44a85c585636ee5455de50a0cb3d886caba0caf4d7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - name: Read versions
        id: versions
        run: echo "kubernetes=$(sed -n 's/^KUBERNETES_VERSION=//p' versions.env)" >> "$GITHUB_OUTPUT"

      # Restore only: deps saved this key; the parallel jobs never race to save it.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            /github/home/.cache/go-build
            /github/home/go/pkg/mod
          key: go-${{ hashFiles('go.sum') }}
          restore-keys: go-

      # setup-envtest stores kube-apiserver/etcd under bin/k8s (see Makefile).
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: bin/k8s
          key: envtest-${{ steps.versions.outputs.kubernetes }}-${{ runner.os }}-${{ runner.arch }}

      - name: envtest
        run: make test-envtest

  sim:
    name: Simulator golden traces
    needs: [changes, deps]
    if: needs.changes.outputs.suite == 'full'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/marcherschel/smb-mount-healer-ci:f1efcd46699ef82731693ce4300bc2953eaadfd5@sha256:55dd187dd2852259466ccf44a85c585636ee5455de50a0cb3d886caba0caf4d7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      # Restore only: deps saved this key; the parallel jobs never race to save it.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            /github/home/.cache/go-build
            /github/home/go/pkg/mod
          key: go-${{ hashFiles('go.sum') }}
          restore-keys: go-

      - name: Simulator golden traces are up to date
        run: |
          make sim-update
          if [ -n "$(git status --porcelain -- internal/sim)" ]; then
            echo "::error::'make sim-update' changed golden traces; run it locally and commit the result."
            git status --porcelain -- internal/sim
            git diff -- internal/sim
            exit 1
          fi

  # Keeps the "Unit + envtest" required check of the main ruleset meaningful:
  # it fails when any of the jobs above failed or was cancelled (a skipped e2e
  # alone would satisfy the ruleset) and succeeds when the change needs no
  # tests (all skipped). deps is checked too: when it fails, the three test
  # jobs are skipped, and skipped alone must not pass.
  unit-gate:
    name: Unit + envtest
    needs: [changes, deps, unit, envtest, sim]
    if: ${{ !cancelled() && needs.changes.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Unit, envtest and golden traces succeeded (or were not needed)
        env:
          RESULTS: ${{ needs.deps.result }} ${{ needs.unit.result }} ${{ needs.envtest.result }} ${{ needs.sim.result }}
        run: |
          echo "deps unit envtest sim: ${RESULTS}"
          for r in ${RESULTS}; do
            case "$r" in success|skipped) ;; *) exit 1 ;; esac
          done

  e2e:
    name: e2e (k3d + tilt ci)
    needs: [lint, unit, envtest, sim]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    container:
      image: ghcr.io/marcherschel/smb-mount-healer-ci:f1efcd46699ef82731693ce4300bc2953eaadfd5@sha256:55dd187dd2852259466ccf44a85c585636ee5455de50a0cb3d886caba0caf4d7
      volumes:
        - /var/run/docker.sock:/var/run/docker.sock
    env:
      E2E_CLUSTER: smbmh-e2e-${{ github.run_id }}-${{ github.run_attempt }}
      # The k3d registry's host port is published on the docker host, not on
      # this container's localhost: build with docker + `k3d image import`.
      SMBMH_E2E_IMAGE_MODE: k3d-import
      # Empty on pull_request and workflow_call runs (input undefined).
      E2E_NODE_CPUSET: ${{ inputs.e2e_node_cpuset }}
      # TEMPORARY (diagnosis): only the scenarios that failed in recent runs
      # (S3 netem in 4 of 5, S12 control plane killed in 2, S4 and S5 once).
      # Restore the full suite by dropping this line. workflow_dispatch can
      # override it (e2e_run; "." runs everything). No "$" anchors: make
      # would expand them; the names are unique as substrings anyway.
      E2E_GO_TEST_FLAGS: -run '${{ inputs.e2e_run || 'TestS3SlowServerNetem|TestS4WrongFSType|TestS5StatefulSet|TestS12ControlPlaneKilled' }}'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      # Restore only: deps saved this key; the parallel jobs never race to save it.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            /github/home/.cache/go-build
            /github/home/go/pkg/mod
          key: go-${{ hashFiles('go.sum') }}
          restore-keys: go-

      # Per-job kubeconfig (RUNNER_TEMP is wiped after the job), so k3d/tilt
      # never touch the persistent /github/home/.kube/config.
      - name: Per-job kubeconfig
        run: |
          {
            echo "KUBECONFIG=${RUNNER_TEMP}/kubeconfig-${E2E_CLUSTER}"
            echo "E2E_KUBECONFIG=${RUNNER_TEMP}/kubeconfig-${E2E_CLUSTER}"
            echo "E2E_ARTIFACTS=${RUNNER_TEMP}/e2e-artifacts"
          } >> "$GITHUB_ENV"

      - name: Create k3d cluster
        run: make e2e-up E2E_CLUSTER="$E2E_CLUSTER"

      - name: Join the k3d network + point kubeconfig at the server container
        run: |
          hack/ci-e2e.sh connect "$E2E_CLUSTER"
          hack/ci-e2e.sh kubeconfig "$E2E_CLUSTER"

      # ubuntu-latest is a 2 vCPU VM for private repos and a 4 vCPU VM for
      # public ones, with the same runner image; S3's netem variant behaved
      # differently between the two. Pinning the node containers emulates the
      # smaller VM (the job container, go test and tilt stay unpinned).
      - name: Pin k3d nodes to CPUs (workflow_dispatch e2e_node_cpuset)
        if: ${{ env.E2E_NODE_CPUSET != '' }}
        run: hack/ci-e2e.sh pin "$E2E_CLUSTER" "$E2E_NODE_CPUSET"

      - name: Runner + kernel info
        continue-on-error: true
        run: |
          mkdir -p "$E2E_ARTIFACTS"
          hack/ci-e2e.sh info "$E2E_CLUSTER" | tee "$E2E_ARTIFACTS/runner-info.txt"

      # Also the Tiltfile's first resource; run it here so a missing cifs
      # module fails fast with a readable step instead of inside tilt ci.
      - name: Preflight (cifs + mount propagation)
        run: test/e2e/hack/preflight.sh "$E2E_CLUSTER"

      # e2e-run, not e2e: `make e2e` deletes its cluster on exit, but CI must
      # collect diagnostics first; the "Delete k3d cluster" step tears it down.
      - name: e2e suite (tilt ci)
        run: |
          mkdir -p "$E2E_ARTIFACTS"
          make e2e-run E2E_CLUSTER="$E2E_CLUSTER" 2>&1 | tee "$E2E_ARTIFACTS/tilt-ci.log"

      # Kernel CIFS client behaviour (stat/statfs of a share root after the
      # server is gone, recovery tail after a smbd freeze); useful when e2e
      # differs between kernels. Opt-in: workflow_dispatch with
      # cifs_diagnostic=true.
      - name: CIFS dead-server diagnostic
        if: ${{ !cancelled() && inputs.cifs_diagnostic }}
        continue-on-error: true
        timeout-minutes: 10
        run: test/e2e/hack/cifs-dead-server.sh 2>&1 | tee "$E2E_ARTIFACTS/cifs-dead-server.txt"

      - name: Collect diagnostics
        if: failure() || cancelled()
        run: hack/ci-e2e.sh collect "$E2E_CLUSTER" "$E2E_ARTIFACTS"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure() || cancelled()
        with:
          name: e2e-${{ github.run_id }}-${{ github.run_attempt }}
          # E2E_ARTIFACTS: diagnostics; test/e2e/_runs: the tilt ci and go test
          # logs make e2e-run tees (E2E_LOG_DIR default).
          path: |
            ${{ env.E2E_ARTIFACTS }}
            test/e2e/_runs/
          if-no-files-found: ignore
          retention-days: 14

      - name: Delete k3d cluster
        if: always()
        run: |
          hack/ci-e2e.sh cleanup "$E2E_CLUSTER"
          make e2e-down E2E_CLUSTER="$E2E_CLUSTER"
