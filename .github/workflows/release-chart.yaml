name: release-chart

# Chart release, started by hand (Actions -> release-chart -> Run workflow on
# main) with the kind of release; the version is never typed or bumped by hand:
#   bump: patch|minor|major  next stable version after the latest stable
#                            chart-v* tag (prerelease: its next -rc.N instead)
#         rc                 next candidate of the open release candidate line
# (hack/next-version.sh). The workflow then creates the release commit on top
# of main (hack/stamp-chart.sh): Chart.yaml `version`, `appVersion` pinned to
# the latest stable app release (newest vX.Y.Z tag without suffix), the
# artifacthub.io/images tag and prerelease flag, and artifacthub.io/changes
# without the entries the previous release already listed. It runs the chart
# checks on that commit, tags it chart-vA.B.C (the commit is reachable only
# from the tag; main keeps its placeholder version) and publishes it:
#   oci://ghcr.io/<owner>/charts/smb-mount-healer:A.B.C
#   ghcr.io/<owner>/charts/smb-mount-healer:artifacthub.io  ArtifactHub repository
#                                    metadata (production/smb-mount-healer/artifacthub-repo.yml)
#   GitHub release chart-vA.B.C with dist/chart (make dist-chart): chart
#   package, Grafana dashboard, Prometheus rule file, PrometheusRule, SHA256SUMS.
# Chart checks gate every publish step: chart lint and tests (helm,
# kubeconform, promtool) and the dashboard/alert metric names. The Go suite
# (unit, envtest, e2e) never runs here; it gates the app release.
# With input `tag`, an existing chart tag is released again (for example after
# a failed run); `bump` is ignored then.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Release kind: patch|minor|major (from the latest stable chart release) or rc (next candidate of the open release candidate)"
        type: choice
        options: [patch, minor, major, rc]
        default: patch
      prerelease:
        description: "With patch|minor|major: release the next release candidate (-rc.N) of that version instead"
        type: boolean
        default: false
      tag:
        description: "Optional: release this existing chart tag again (chart-vA.B.C[-rc.N]) instead of a new version"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: release-chart-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: safe.directory
  GIT_CONFIG_VALUE_0: "*"

defaults:
  run:
    shell: bash

jobs:
  prepare:
    name: Release commit + chart checks
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the release tag
      packages: read # pull the CI image from GHCR
    container:
      image: ghcr.io/marcherschel/smb-mount-healer-ci:f1efcd46699ef82731693ce4300bc2953eaadfd5@sha256:55dd187dd2852259466ccf44a85c585636ee5455de50a0cb3d886caba0caf4d7
      # make chart-test runs the pinned kubeconform and promtool images.
      volumes:
        - /var/run/docker.sock:/var/run/docker.sock
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.sha }}
          fetch-depth: 0 # tags: next version, latest app release, previous changes

      # New release: next version from the tags, release commit stamped on top
      # of main. Existing tag: checked out as is.
      - name: Version and release commit
        id: plan
        env:
          INPUT_TAG: ${{ inputs.tag }}
          BUMP: ${{ inputs.bump }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          chart=production/smb-mount-healer
          if [ -n "$INPUT_TAG" ]; then
            if [[ ! "$INPUT_TAG" =~ ^chart-v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::tag ${INPUT_TAG} is not chart-vA.B.C[-pre]"
              exit 1
            fi
            echo "release existing tag ${INPUT_TAG}"
            echo "tag=${INPUT_TAG}" >> "$GITHUB_OUTPUT"
            echo "new=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::new chart releases are cut from main (run the workflow on main, not ${GITHUB_REF})"
            exit 1
          fi
          version=$(hack/next-version.sh chart "$BUMP" "$PRERELEASE")
          tag="chart-v${version}"
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "::error::tag ${tag} already exists"
            exit 1
          fi
          # The chart always deploys the latest stable app release.
          app_tag=$(git -c versionsort.suffix=- tag -l 'v[0-9]*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1 || true)
          if [ -z "$app_tag" ]; then
            echo "::error::no stable app release (vX.Y.Z) yet; release the app first"
            exit 1
          fi
          # Changes are listed since the previous stable release (a release
          # also lists what its candidates had), a candidate's since the
          # previous chart release of any kind.
          if [[ "$version" == *-* ]]; then
            previous=$(git -c versionsort.suffix=- tag -l 'chart-v[0-9]*' --sort=-v:refname | head -1 || true)
          else
            previous=$(git -c versionsort.suffix=- tag -l 'chart-v[0-9]*' --sort=-v:refname | grep -E '^chart-v[0-9]+\.[0-9]+\.[0-9]+$' | head -1 || true)
          fi
          hack/stamp-chart.sh "$version" "${app_tag#v}" "$previous"
          # Refuse a release identical to the previous one (apart from the
          # stamped version fields).
          if [ -n "$previous" ]; then
            strip='del(.version) | del(.annotations."artifacthub.io/prerelease") | del(.annotations."artifacthub.io/changes")'
            if git diff --quiet "$previous" -- "$chart" ":(exclude)${chart}/Chart.yaml" &&
              [ "$(git show "${previous}:${chart}/Chart.yaml" | yq "$strip")" = "$(yq "$strip" "${chart}/Chart.yaml")" ]; then
              echo "::error::the chart did not change since ${previous}; nothing to release"
              exit 1
            fi
          fi
          git diff
          echo "release ${tag} (appVersion ${app_tag#v}, changes since ${previous:-the start})"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "new=true" >> "$GITHUB_OUTPUT"

      # helm lint --strict + helm template/kubeconform/promtool/yq assertions
      # for every ci/*-values.yaml (hack/chart-test.sh).
      - name: Helm chart lint + test
        run: make chart-lint chart-test

      - name: Dashboard and alerts use existing metric names
        run: hack/check-dashboard-metrics.sh

      # The release commit is reachable only from its tag (main accepts pull
      # requests only, and its Chart.yaml version stays a placeholder).
      - name: Commit and tag the release
        if: steps.plan.outputs.new == 'true'
        env:
          TAG: ${{ steps.plan.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -am "chore(chart): release ${TAG#chart-v}"
          git -c tag.gpgSign=false tag -a "$TAG" -m "$TAG"
          git push origin "refs/tags/${TAG}"
          echo "pushed ${TAG} -> $(git rev-parse HEAD) (parent ${GITHUB_SHA})"

  publish:
    name: Chart
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    container:
      image: ghcr.io/marcherschel/smb-mount-healer-ci:f1efcd46699ef82731693ce4300bc2953eaadfd5@sha256:55dd187dd2852259466ccf44a85c585636ee5455de50a0cb3d886caba0caf4d7
    outputs:
      version: ${{ steps.check.outputs.version }}
      digest: ${{ steps.push.outputs.digest }}
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      IMAGE_REPO: ghcr.io/${{ github.repository_owner }}/smb-mount-healer
      CHART_REPO: ghcr.io/${{ github.repository_owner }}/charts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.prepare.outputs.tag }}

      - name: Log in to GHCR (helm, oras)
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          printf '%s' "$GHCR_TOKEN" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin

      # Tag == Chart.yaml version, the version is not published yet, and the
      # image the chart deploys by default (appVersion) exists.
      - name: Check versions
        id: check
        run: |
          chart=production/smb-mount-healer/Chart.yaml
          version=$(yq '.version' "$chart")
          app_version=$(yq '.appVersion' "$chart")
          if [ "${TAG#chart-v}" != "$version" ]; then
            echo "::error::tag ${TAG} does not match Chart.yaml version ${version}"
            exit 1
          fi
          # GHCR lets a tag be overwritten, so refuse to re-push a version.
          if oras manifest fetch "${CHART_REPO}/smb-mount-healer:${version}" >/dev/null 2>&1; then
            echo "::error::chart smb-mount-healer ${version} is already published; release a new version instead"
            exit 1
          fi
          if ! oras manifest fetch "${IMAGE_REPO}:${app_version}" >/dev/null; then
            echo "::error::appVersion ${app_version}: image ${IMAGE_REPO}:${app_version} does not exist (release the app first: tag v${app_version})"
            exit 1
          fi
          echo "chart ${version}, appVersion ${app_version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Build release assets (make dist-chart)
        run: make dist-chart CHART_VERSION="$TAG"

      - name: Push chart
        id: push
        env:
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          helm push "dist/chart/smb-mount-healer-${VERSION}.tgz" "oci://${CHART_REPO}" 2>&1 | tee "${RUNNER_TEMP}/helm-push.log"
          digest=$(grep -oE 'sha256:[0-9a-f]{64}' "${RUNNER_TEMP}/helm-push.log" | tail -1)
          if [ -z "$digest" ]; then
            echo "::error::no chart digest in helm push output"
            exit 1
          fi
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      # ArtifactHub reads repository metadata (verified publisher, owners) from
      # the special tag artifacthub.io next to the chart.
      - name: Push ArtifactHub repository metadata
        if: hashFiles('production/smb-mount-healer/artifacthub-repo.yml') != ''
        run: |
          oras push "${CHART_REPO}/smb-mount-healer:artifacthub.io" \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            production/smb-mount-healer/artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-chart
          path: dist/chart/
          if-no-files-found: error

  # cosign-installer needs envsubst, which the CI image lacks: sign on the
  # plain runner. Keyless signature (GitHub OIDC -> Sigstore) attached to the
  # chart in GHCR; ArtifactHub shows OCI charts with a cosign signature as
  # signed.
  sign:
    name: Sign chart
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # keyless cosign signature
    steps:
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Sign the chart (cosign, keyless)
        env:
          REF: ghcr.io/${{ github.repository_owner }}/charts/smb-mount-healer@${{ needs.publish.outputs.digest }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | cosign login ghcr.io -u "${{ github.actor }}" --password-stdin
          cosign sign --yes "$REF"

  github-release:
    name: GitHub release
    needs: [prepare, publish, sign]
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.prepare.outputs.tag }}
          fetch-depth: 0 # previous chart tag for the release notes

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-chart
          path: dist/chart

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.publish.outputs.version }}
        run: |
          chart=production/smb-mount-healer/Chart.yaml
          app_version=$(yq '.appVersion' "$chart")
          # Notes: the curated artifacthub.io/changes of this version, then the
          # PRs since the previous chart release (never since a v* app tag).
          notes="${RUNNER_TEMP}/notes.md"
          {
            echo "Helm chart \`smb-mount-healer\` ${VERSION}, deploys app version [v${app_version}](https://github.com/${GITHUB_REPOSITORY}/releases/tag/v${app_version}) by default."
            echo
            echo '```sh'
            echo "helm install smb-mount-healer oci://ghcr.io/${GITHUB_REPOSITORY_OWNER}/charts/smb-mount-healer --version ${VERSION}"
            echo '```'
            echo
            echo "### Changes"
            yq '.annotations."artifacthub.io/changes" // "[]"' "$chart" | yq '.[] | "- " + .kind + ": " + .description'
          } >"$notes"
          flags=(--generate-notes --verify-tag --notes-file "$notes")
          previous=$(git -c versionsort.suffix=- tag -l 'chart-v*' --sort=-v:refname | grep -vx "$TAG" | head -1 || true)
          if [ -n "$previous" ]; then
            flags+=(--notes-start-tag "$previous")
          fi
          # Only -rc/-beta/... chart versions are prereleases. Chart releases
          # never become the repository's "Latest" release; that is the app's.
          flags+=(--latest=false)
          if [[ "$VERSION" == *-* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$TAG" dist/chart/* --repo "$GITHUB_REPOSITORY" \
            --title "smb-mount-healer chart ${VERSION}" "${flags[@]}"
