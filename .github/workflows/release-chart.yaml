name: release-chart

# Chart release: pushing a tag chart-vA.B.C (or chart-vA.B.C-rc.N) publishes
# the chart exactly as committed (Chart.yaml `version` must be A.B.C):
#   oci://ghcr.io/<owner>/charts/smb-mount-healer:A.B.C
#   ghcr.io/<owner>/charts/smb-mount-healer:artifacthub.io  ArtifactHub repository
#                                    metadata (production/smb-mount-healer/artifacthub-repo.yml)
#   GitHub release chart-vA.B.C with dist/chart (make dist-chart): chart
#   package, Grafana dashboard, Prometheus rule file, PrometheusRule, SHA256SUMS.
# The chart's appVersion must be a published app release (tags v*,
# release-app.yaml). Chart checks gate every publish step: chart lint and
# tests (helm, kubeconform, promtool) and the dashboard/alert metric names.
# The Go suite (unit, envtest, e2e) never runs here; it gates the app release.
# A manual run (workflow_dispatch, input tag) releases an existing chart tag
# again, for example after a failed run.

on:
  push:
    tags: ["chart-v[0-9]+.[0-9]+.[0-9]+", "chart-v[0-9]+.[0-9]+.[0-9]+-*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing chart tag to release (chart-vA.B.C or chart-vA.B.C-rc.N)"
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: release-chart-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  # The chart tag: the pushed tag, or the manual run's input.
  TAG: ${{ inputs.tag || github.ref_name }}
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: safe.directory
  GIT_CONFIG_VALUE_0: "*"

defaults:
  run:
    shell: bash

jobs:
  chart-checks:
    name: Chart checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read # pull the CI image from GHCR
    container:
      image: ghcr.io/marcherschel/smb-mount-healer-ci:f1efcd46699ef82731693ce4300bc2953eaadfd5@sha256:55dd187dd2852259466ccf44a85c585636ee5455de50a0cb3d886caba0caf4d7
      # make chart-test runs the pinned kubeconform and promtool images.
      volumes:
        - /var/run/docker.sock:/var/run/docker.sock
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}

      - name: Tag exists and is a chart tag
        run: |
          if [[ ! "$TAG" =~ ^chart-v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::tag ${TAG} is not chart-vA.B.C[-pre]"
            exit 1
          fi

      # helm lint --strict + helm template/kubeconform/promtool/yq assertions
      # for every ci/*-values.yaml (hack/chart-test.sh).
      - name: Helm chart lint + test
        run: make chart-lint chart-test

      - name: Dashboard and alerts use existing metric names
        run: hack/check-dashboard-metrics.sh

  publish:
    name: Chart
    needs: chart-checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # keyless cosign signature
    container:
      image: ghcr.io/marcherschel/smb-mount-healer-ci:f1efcd46699ef82731693ce4300bc2953eaadfd5@sha256:55dd187dd2852259466ccf44a85c585636ee5455de50a0cb3d886caba0caf4d7
    outputs:
      version: ${{ steps.check.outputs.version }}
    env:
      IMAGE_REPO: ghcr.io/${{ github.repository_owner }}/smb-mount-healer
      CHART_REPO: ghcr.io/${{ github.repository_owner }}/charts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}

      - name: Log in to GHCR (helm, oras)
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          printf '%s' "$GHCR_TOKEN" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin

      # Tag == Chart.yaml version, the version is not published yet, and the
      # image the chart deploys by default (appVersion) exists.
      - name: Check versions
        id: check
        run: |
          chart=production/smb-mount-healer/Chart.yaml
          version=$(yq '.version' "$chart")
          app_version=$(yq '.appVersion' "$chart")
          if [ "${TAG#chart-v}" != "$version" ]; then
            echo "::error::tag ${TAG} does not match Chart.yaml version ${version}"
            exit 1
          fi
          # GHCR lets a tag be overwritten, so refuse to re-push a version.
          if oras manifest fetch "${CHART_REPO}/smb-mount-healer:${version}" >/dev/null 2>&1; then
            echo "::error::chart smb-mount-healer ${version} is already published; bump Chart.yaml version"
            exit 1
          fi
          if ! oras manifest fetch "${IMAGE_REPO}:${app_version}" >/dev/null; then
            echo "::error::appVersion ${app_version}: image ${IMAGE_REPO}:${app_version} does not exist (release the app first: tag v${app_version})"
            exit 1
          fi
          echo "chart ${version}, appVersion ${app_version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Build release assets (make dist-chart)
        run: make dist-chart CHART_VERSION="$TAG"

      - name: Push chart
        id: push
        env:
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          helm push "dist/chart/smb-mount-healer-${VERSION}.tgz" "oci://${CHART_REPO}" 2>&1 | tee "${RUNNER_TEMP}/helm-push.log"
          digest=$(grep -oE 'sha256:[0-9a-f]{64}' "${RUNNER_TEMP}/helm-push.log" | tail -1)
          if [ -z "$digest" ]; then
            echo "::error::no chart digest in helm push output"
            exit 1
          fi
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Keyless signature (GitHub OIDC -> Sigstore) attached to the chart in
      # GHCR. ArtifactHub shows OCI charts with a cosign signature as signed.
      - name: Sign the chart (cosign, keyless)
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | cosign login ghcr.io -u "${{ github.actor }}" --password-stdin
          cosign sign --yes "${CHART_REPO}/smb-mount-healer@${DIGEST}"

      # ArtifactHub reads repository metadata (verified publisher, owners) from
      # the special tag artifacthub.io next to the chart.
      - name: Push ArtifactHub repository metadata
        if: hashFiles('production/smb-mount-healer/artifacthub-repo.yml') != ''
        run: |
          oras push "${CHART_REPO}/smb-mount-healer:artifacthub.io" \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            production/smb-mount-healer/artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-chart
          path: dist/chart/
          if-no-files-found: error

  github-release:
    name: GitHub release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          fetch-depth: 0 # previous chart tag for the release notes

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-chart
          path: dist/chart

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.publish.outputs.version }}
        run: |
          chart=production/smb-mount-healer/Chart.yaml
          app_version=$(yq '.appVersion' "$chart")
          # Notes: the curated artifacthub.io/changes of this version, then the
          # PRs since the previous chart release (never since a v* app tag).
          notes="${RUNNER_TEMP}/notes.md"
          {
            echo "Helm chart \`smb-mount-healer\` ${VERSION}, deploys app version [v${app_version}](https://github.com/${GITHUB_REPOSITORY}/releases/tag/v${app_version}) by default."
            echo
            echo '```sh'
            echo "helm install smb-mount-healer oci://ghcr.io/${GITHUB_REPOSITORY_OWNER}/charts/smb-mount-healer --version ${VERSION}"
            echo '```'
            echo
            echo "### Changes"
            yq '.annotations."artifacthub.io/changes"' "$chart" | yq '.[] | "- " + .kind + ": " + .description'
          } >"$notes"
          flags=(--generate-notes --verify-tag --notes-file "$notes")
          previous=$(git -c versionsort.suffix=- tag -l 'chart-v*' --sort=-v:refname | grep -vx "$TAG" | head -1 || true)
          if [ -n "$previous" ]; then
            flags+=(--notes-start-tag "$previous")
          fi
          # Only -rc/-beta/... chart versions are prereleases. Chart releases
          # never become the repository's "Latest" release; that is the app's.
          flags+=(--latest=false)
          if [[ "$VERSION" == *-* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$TAG" dist/chart/* --repo "$GITHUB_REPOSITORY" \
            --title "smb-mount-healer chart ${VERSION}" "${flags[@]}"
