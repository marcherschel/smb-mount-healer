name: ci-image

# Builds the CI toolbox image (.github/ci-image) with the tool versions from
# versions.env and pushes ghcr.io/<owner>/smb-mount-healer-ci:<commit sha>.
# ci.yaml, release-app.yaml and release-chart.yaml pin it by digest: after this workflow ran, copy the
# digest from the job summary into those files (Renovate keeps it current
# afterwards).

on:
  push:
    branches: [main]
    paths:
      - ".github/ci-image/**"
      - "versions.env"
      - ".github/workflows/ci-image.yaml"
  pull_request:
    paths:
      - ".github/ci-image/**"
      - "versions.env"
      - ".github/workflows/ci-image.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build${{ github.event_name != 'pull_request' && ' and push' || '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/smb-mount-healer-ci:${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The final apt-get layer runs under the target platform.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build linux/amd64 + linux/arm64
        env:
          # Pull requests only build (a multi-platform image cannot be loaded).
          OUTPUT: ${{ github.event_name != 'pull_request' && '--push' || '' }}
          PLATFORMS: linux/amd64,linux/arm64
        run: .github/ci-image/build.sh

      - name: Digest
        if: github.event_name != 'pull_request'
        run: |
          digest=$(docker buildx imagetools inspect "$IMAGE" --format '{{json .Manifest}}' | jq -r .digest)
          echo "pushed ${IMAGE}@${digest}"
          {
            echo "### CI image"
            echo
            echo "Pin in .github/workflows/ci.yaml, release-app.yaml and release-chart.yaml:"
            echo
            echo '```'
            echo "image: ${IMAGE}@${digest}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
